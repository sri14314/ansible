---
- name: RHEL Server Hardening (CIS Level 1)
  hosts: rhel
  become: yes
  vars:
    cis_level: 1  # 1 or 2

  tasks:
    - name: Update all packages
      dnf:
        name: '*'
        state: latest
        security: yes

    - name: Enable firewall
      firewalld:
        service: ssh
        permanent: yes
        state: enabled
        immediate: yes
      notify: restart firewalld

    - name: Set password policy (/etc/security/pwquality.conf)
      lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^#?{{ item.regexp }}'
        line: "{{ item.line }}"
      loop:
        - { regexp: 'minlen', line: 'minlen = 14' }
        - { regexp: 'dcredit', line: 'dcredit = -1' }
        - { regexp: 'ucredit', line: 'ucredit = -1' }
        - { regexp: 'lcredit', line: 'lcredit = -1' }
        - { regexp: 'ocredit', line: 'ocredit = -1' }

    - name: Harden SSH (/etc/ssh/sshd_config)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?{{ item.regexp }}'
        line: "{{ item.line }}"
        validate: 'sshd -t'
      loop:
        - { regexp: 'PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: 'PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: 'PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: 'ClientAliveInterval', line: 'ClientAliveInterval 300' }
      notify: restart sshd

    - name: Disable unnecessary services
      systemd:
        name: "{{ item }}"
        enabled: no
        state: stopped
      loop:
        - avahi-daemon
        - cups

    - name: Kernel hardening (/etc/sysctl.conf)
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: 'kernel.kptr_restrict', value: '2' }
        - { name: 'kernel.dmesg_restrict', value: '1' }
        - { name: 'kernel.yama.ptrace_scope', value: '1' }
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }

    - name: Set GRUB password protection
      lineinfile:
        path: /etc/grub.d/01_users
        line: '{{ item }}'
      loop:
        - 'set superusers="admin"'
        - 'password_pbkdf2 admin {{ "your_grub_hash_here" | to_yaml }}  # grub-mkpasswd-pbkdf2'
      notify: update-grub

  handlers:
    - name: restart sshd
      systemd: name=sshd state=restarted

    - name: restart firewalld
      systemd: name=firewalld state=restarted

    - name: update-grub
      command: grub2-mkconfig -o /boot/grub2/grub.cfg
